    <circle cx="50" cy="50" r="13" fill="url(#mass-body)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="12" fill="none" stroke="#ff2600" stroke-opacity="0.44" stroke-width="1.4"/>
    <ellipse cx="44" cy="42" rx="4.8" ry="3.2" fill="#ffffff" opacity="0.18"/>
