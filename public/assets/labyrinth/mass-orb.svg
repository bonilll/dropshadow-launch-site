<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Mass Orb</title>
  <desc id="desc">Variant exported from room_021, active feature at cell [9, 16].</desc>
  <defs>
    <radialGradient id="mass-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a75" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#ff2600" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#ff2600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff2600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mass-body" cx="43%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ff8a75"/>
      <stop offset="42%" stop-color="#ff5a3d"/>
      <stop offset="100%" stop-color="#ff2600"/>
    </radialGradient>
    <radialGradient id="hazard-body" cx="42%" cy="32%" r="66%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="42%" stop-color="#a2a2a2"/>
      <stop offset="100%" stop-color="#646464"/>
    </radialGradient>
    <linearGradient id="boost-line" x1="18" x2="82" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e4e4e4"/>
